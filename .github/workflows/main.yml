name: Build

on:
  push:
    paths:
      - .github/workflows/main.yml
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
    tags:
      - '*'
    branches:
      - '**'

jobs:
  build-plugin:
    strategy:
      matrix:
        include:
          - obs-version: '28.0.3'
            obs-package: 'https://github.com/obsproject/obs-studio/releases/download/28.0.3/obs-studio_28.0.3-0obsproject1_kinetic_amd64.deb'
            bin-path: 'bin/64bit'
            legacy: 'ON'
          - obs-version: '30.2.0'
            obs-package: 'https://github.com/obsproject/obs-studio/releases/download/30.2.0/OBS-Studio-30.2.0-Ubuntu-24.04-x86_64.deb'
            bin-path: 'bin/64bit'
            legacy: 'ON'
          - obs-version: '33.0.0'
            obs-package: 'https://github.com/obsproject/obs-studio/releases/download/33.0.0/OBS-Studio-33.0.0-Ubuntu-26.04-x86_64.deb'
            bin-path: ''
            legacy: 'OFF'
    name: 'Build Plugin'
    runs-on: ubuntu-latest
    steps:
      - name: 'Install system dependencies'
        run: sudo apt install libpipewire-0.3-dev libsimde-dev
      - name: 'Restore OBS from cache'
        uses: actions/cache@v4
        id: cache-obs
        with:
          path: obs.deb
          key: ${{ matrix.obs-version }}
      - name: 'Download OBS'
        env:
          OBS_PACKAGE: ${{matrix.obs-package}}
        if: steps.cache-obs.outputs.cache-hit != 'true'
        run: |
          wget $OBS_PACKAGE -O obs.deb
      - name: 'Install OBS'
        run: sudo dpkg --force-all -i obs.deb
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          path: 'plugin'
      - name: 'Configure'
        env:
          LEGACY: ${{matrix.legacy}}
        run: cmake -B ./plugin/build -S ./plugin -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLEGACY=$LEGACY
      - name: 'Build'
        run: cmake --build ./plugin/build -j4
      - name: 'Package'
        env:
          OBS_VERSION: ${{matrix.obs-version}}
          BIN_PATH: ${{matrix.bin-path}}
        run: |
          mkdir -p ./linux-pipewire-audio/$BIN_PATH
          cp ./plugin/build/linux-pipewire-audio.so ./linux-pipewire-audio/$BIN_PATH/linux-pipewire-audio.so
          cp -r ./plugin/data/ ./linux-pipewire-audio/data/
          tar -zcvf linux-pipewire-audio-$OBS_VERSION.tar.gz linux-pipewire-audio
      - name: 'Upload'
        uses: actions/upload-artifact@v4
        with:
          path: linux-pipewire-audio-${{ matrix.obs-version }}.tar.gz
          name: linux-pipewire-audio-${{ matrix.obs-version }}
